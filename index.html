<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Polyglot Cards</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>Polyglot Cards</h1>
    <p>English · Deutsch · Español</p>
  </header>

  <main>
    <form id="card-form">
      <label>
        Language
        <select id="lang" required>
          <option value="en">English</option>
          <option value="de">Deutsch</option>
          <option value="es">Español</option>
        </select>
      </label>

      <label>
        Word
        <input id="word" type="text" required>
      </label>

      <label>
        Translation / meaning
        <input id="translation" type="text" required>
      </label>

      <label>
        Example sentence (optional)
        <input id="sentence" type="text">
      </label>

      <button type="submit">Add card</button>
    </form>

    <h2>Your cards (<span id="count">0</span>)</h2>
    <ul id="card-list"></ul>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
