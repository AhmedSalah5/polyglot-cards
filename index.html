<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Polyglot Cards</title>
  <link rel="stylesheet" href="css/output.css">
</head>
<body class="min-h-screen bg-slate-50 text-slate-900 dark:bg-slate-900 dark:text-slate-100">
  <div class="mx-auto max-w-2xl px-4 py-10">

    <header class="mb-8 text-center">
      <h1 class="text-4xl font-bold tracking-tight">Polyglot Cards</h1>
      <p class="mt-2 text-slate-500 dark:text-slate-400">English · Deutsch · Español</p>
    </header>

    <main>
      <form id="card-form"
            class="grid gap-4 rounded-2xl bg-white p-6 shadow-sm ring-1 ring-slate-200 dark:bg-slate-800 dark:ring-slate-700">
        <label class="grid gap-1 text-sm font-medium">
          Language
          <select id="lang" class="field" required>
            <option value="en">English</option>
            <option value="de">Deutsch</option>
            <option value="es">Español</option>
          </select>
        </label>

        <label class="grid gap-1 text-sm font-medium">
          Word
          <input id="word" type="text" class="field" required>
        </label>

        <label class="grid gap-1 text-sm font-medium">
          Translation / meaning
          <input id="translation" type="text" class="field" required>
        </label>

        <label class="grid gap-1 text-sm font-medium">
          Example sentence (optional)
          <input id="sentence" type="text" class="field">
        </label>

        <button type="submit" class="btn-primary">Add card</button>
      </form>

      <h2 class="mt-10 mb-4 text-xl font-semibold">
        Your cards (<span id="count">0</span>)
      </h2>
      <ul id="card-list" class="grid gap-3"></ul>
    </main>

  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
